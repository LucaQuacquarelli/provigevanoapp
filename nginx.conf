server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history mode: fallback a index.html per tutte le route.
    # Senza questo, un refresh su /teams darebbe 404 perché nginx
    # cercherebbe un file fisico chiamato "teams" che non esiste.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
